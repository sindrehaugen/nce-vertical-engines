name: CI — Dual-Axis Modular Wheel Matrix

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  wheel-single:
    name: Wheel Verify (Single Engine — odoo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build Wheelhouse & Wheel
        run: |
          python -m pip install --upgrade pip build wheel
          python -m pip wheel --no-deps --wheel-dir /tmp/wheelhouse "git+https://github.com/sindrehaugen/neuro-cognitive-engine.git@v3.4.2"
          python -m build --wheel

      - name: Verify Single-Engine Wheel in Clean Venv (/tmp/venv_single)
        run: |
          python -m venv /tmp/venv_single
          /tmp/venv_single/bin/pip install --upgrade pip pytest pytest-asyncio
          WHEEL_PATH=$(ls "$GITHUB_WORKSPACE"/dist/nce_vertical_engines-*.whl)
          /tmp/venv_single/bin/pip install --find-links /tmp/wheelhouse "${WHEEL_PATH}[odoo]"
          cd /tmp
          NCE_ENABLED_ENGINES=odoo /tmp/venv_single/bin/python -c "
          from nce_verticals.plugin import VerticalEnginesPlugin
          p = VerticalEnginesPlugin()
          names = [sp.name for sp in p.sub_plugins]
          assert names == ['odoo'], f'Expected [\"odoo\"], got {names}'
          assert p.get_migrations_dir().is_dir()
          "
          /tmp/venv_single/bin/nce-verticals list --type erp-crm --json
          /tmp/venv_single/bin/pytest "$GITHUB_WORKSPACE/tests/test_registry_filters.py" -q

  wheel-type-filter:
    name: Wheel Verify (Type Filter — type-erp-crm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build Wheelhouse & Wheel
        run: |
          python -m pip install --upgrade pip build wheel
          python -m pip wheel --no-deps --wheel-dir /tmp/wheelhouse "git+https://github.com/sindrehaugen/neuro-cognitive-engine.git@v3.4.2"
          python -m build --wheel

      - name: Verify Type-Filter Wheel in Clean Venv (/tmp/venv_type)
        run: |
          python -m venv /tmp/venv_type
          /tmp/venv_type/bin/pip install --upgrade pip pytest pytest-asyncio
          WHEEL_PATH=$(ls "$GITHUB_WORKSPACE"/dist/nce_vertical_engines-*.whl)
          /tmp/venv_type/bin/pip install --find-links /tmp/wheelhouse "${WHEEL_PATH}[type-erp-crm]"
          cd /tmp
          NCE_ENGINE_TYPE_FILTER=erp-crm /tmp/venv_type/bin/python -c "
          from nce_verticals.plugin import VerticalEnginesPlugin
          p = VerticalEnginesPlugin()
          names = sorted(sp.name for sp in p.sub_plugins)
          assert names == ['dynamics365', 'odoo', 'salesforce'], f'Unexpected: {names}'
          "
          /tmp/venv_type/bin/pytest "$GITHUB_WORKSPACE/tests/test_registry_filters.py" -q

  wheel-category-filter:
    name: Wheel Verify (Category + Intersection — cat-av-it-integrator)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build Wheelhouse & Wheel
        run: |
          python -m pip install --upgrade pip build wheel
          python -m pip wheel --no-deps --wheel-dir /tmp/wheelhouse "git+https://github.com/sindrehaugen/neuro-cognitive-engine.git@v3.4.2"
          python -m build --wheel

      - name: Verify Category & Intersection Wheel in Clean Venv (/tmp/venv_cat)
        run: |
          python -m venv /tmp/venv_cat
          /tmp/venv_cat/bin/pip install --upgrade pip pytest pytest-asyncio
          WHEEL_PATH=$(ls "$GITHUB_WORKSPACE"/dist/nce_vertical_engines-*.whl)
          /tmp/venv_cat/bin/pip install --find-links /tmp/wheelhouse "${WHEEL_PATH}[cat-av-it-integrator]"
          cd /tmp
          NCE_ENGINE_CATEGORY_FILTER=av-it-integrator /tmp/venv_cat/bin/python -c "
          from nce_verticals.plugin import VerticalEnginesPlugin
          p = VerticalEnginesPlugin()
          assert len(p.sub_plugins) == 11, f'Expected 11 engines, got {len(p.sub_plugins)}'
          "
          NCE_ENGINE_TYPE_FILTER=infra-iot NCE_ENGINE_CATEGORY_FILTER=av-it-integrator /tmp/venv_cat/bin/python -c "
          from nce_verticals.plugin import VerticalEnginesPlugin
          p = VerticalEnginesPlugin()
          names = sorted(sp.name for sp in p.sub_plugins)
          assert names == ['assets', 'netbox'], f'Unexpected: {names}'
          "
          /tmp/venv_cat/bin/pytest "$GITHUB_WORKSPACE/tests/test_registry_filters.py" -q

  wheel-full-suite:
    name: Wheel Verify (All 22 Engines, Ruff, Mypy & Unit Suite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Full Suite & Dev Dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip wheel --no-deps --wheel-dir /tmp/wheelhouse "git+https://github.com/sindrehaugen/neuro-cognitive-engine.git@v3.4.2"
          pip install --find-links /tmp/wheelhouse -e ".[all,dev]"

      - name: Ruff Format & Lint
        run: |
          ruff format --check nce_verticals/registry.py nce_verticals/plugin.py nce_verticals/cli.py nce_verticals/replay_fence.py nce_verticals/security/ nce_verticals/servers/ nce_verticals/odoo/app.py nce_verticals/salesforce/app.py src/nce-netbox-plugin/ tests/test_registry_filters.py tests/unit/test_entra_salesforce.py tests/test_enterprise_23_engines_contract.py tests/security/test_v33_vertical_security.py tests/security/test_v34_vertical_hardening.py tests/test_migration_sequence.py
          ruff check nce_verticals/ src/nce-netbox-plugin/ tests/test_registry_filters.py tests/unit/test_entra_salesforce.py tests/test_enterprise_23_engines_contract.py tests/security/test_v33_vertical_security.py tests/security/test_v34_vertical_hardening.py tests/test_migration_sequence.py

      - name: Mypy Typecheck
        run: |
          mypy nce_verticals/registry.py nce_verticals/cli.py nce_verticals/replay_fence.py nce_verticals/security/ nce_verticals/servers/ nce_verticals/odoo/app.py nce_verticals/salesforce/app.py src/nce-netbox-plugin/

      - name: Run Modular & Vertical Unit Tests
        run: |
          pytest tests/test_registry_filters.py tests/unit/test_entra_salesforce.py tests/test_enterprise_23_engines_contract.py tests/security/test_v33_vertical_security.py tests/security/test_v34_vertical_hardening.py tests/test_migration_sequence.py -q

      - name: Build & Verify Full Wheel in Clean Venv (/tmp/venv_all)
        run: |
          python -m build --wheel
          python -m venv /tmp/venv_all
          /tmp/venv_all/bin/pip install --upgrade pip pytest pytest-asyncio
          WHEEL_PATH=$(ls "$GITHUB_WORKSPACE"/dist/nce_vertical_engines-*.whl)
          /tmp/venv_all/bin/pip install --find-links /tmp/wheelhouse "${WHEEL_PATH}[all]"
          cd /tmp
          NCE_ENABLED_ENGINES=all /tmp/venv_all/bin/python -c "
          from nce_verticals.plugin import VerticalEnginesPlugin
          p = VerticalEnginesPlugin()
          assert len(p.sub_plugins) >= 22, f'Expected >=22 plugins, got {len(p.sub_plugins)}'
          "
          /tmp/venv_all/bin/pytest "$GITHUB_WORKSPACE/tests/test_registry_filters.py" "$GITHUB_WORKSPACE/tests/security/test_v33_vertical_security.py" -q
